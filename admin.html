
<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARVI ONLINE & CSC - Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0002;
    }
    h2 { color: #123b70; text-align: center; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      background: #123b70;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #status { margin-top: 15px; overflow-wrap: anywhere; }
    #panel { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>આર્વી ઓનલાઈન & CSC</h2>
    <h3>Admin Login</h3>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin Email" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Login કરો</button>
    </form>

    <div id="panel">
      <h3>Admin Panel</h3>
      <p>લૉગિન સફળ થયું છે.</p>
      <button id="logoutBtn" type="button">Logout</button>
    </div>

    <p id="status" role="status"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABMSiPr8QoRaNSMdWDL-Y_cjrrqcfsb_c",
      authDomain: "arvi-online-csc.firebaseapp.com",
      projectId: "arvi-online-csc",
      storageBucket: "arvi-online-csc.firebasestorage.app",
      messagingSenderId: "57206587457",
      appId: "1:57206587457:web:3723726ba2f2ecbd6d86c0",
      measurementId: "G-JJX8CE0TE9"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const form = document.getElementById("loginForm");
    const panel = document.getElementById("panel");
    const status = document.getElementById("status");

    function showLogin(user) {
      const isAdmin = user &&
        user.uid === "nIreaPMvujbR9IrdilWpSyz3o623";

      form.style.display = isAdmin ? "none" : "block";
      panel.style.display = isAdmin ? "block" : "none";

      if (user && !isAdmin) {
        auth.signOut();
        status.textContent = "આ યુઝરને Admin પરવાનગી નથી.";
      }
    }

    auth.onAuthStateChanged(showLogin);

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      status.textContent = "લૉગિન થઈ રહ્યું છે...";

      try {
        const result = await auth.signInWithEmailAndPassword(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );

        if (result.user.uid !== "nIreaPMvujbR9IrdilWpSyz3o623") {
          await auth.signOut();
          status.textContent = "આ યુઝરને Admin પરવાનગી નથી.";
          return;
        }

        status.textContent = "Admin Login સફળ થયું!";
      } catch (error) {
        status.textContent =
          "લૉગિન નિષ્ફળ: " + error.message;
      }
    });

    document.getElementById("logoutBtn")
      .addEventListener("click", async function() {
        await auth.signOut();
        status.textContent = "તમે Logout થયા છો.";
      });
  </script>
</body>
</html>
