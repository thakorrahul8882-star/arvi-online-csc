
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARVI ONLINE & CSC Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3f9;margin:0;padding:15px;color:#172033}
.container{max-width:700px;margin:20px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001}
h2{color:#123b70;text-align:center}
input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd3df;border-radius:8px;font-size:16px}
textarea{min-height:100px}
button{background:#123b70;color:white;border:0;cursor:pointer}
.secondary{background:#586579}
.item{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:9px;overflow-wrap:anywhere}
.item h3{margin-top:0}
.status{overflow-wrap:anywhere}
#dashboard{display:none}
.checkrow{display:flex;align-items:center;gap:8px;margin:12px 0}
.checkrow input{width:auto;margin:0}
</style>
</head>
<body>
<div class="container">
<h2>આર્વી ઓનલાઈન & CSC</h2>
<p style="text-align:center">Admin Panel — યોજના અને ભરતી વ્યવસ્થાપન</p>

<section id="loginSection">
<h3>Admin Login</h3>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login કરો</button>
</form>
</section>

<section id="dashboard">
<button id="logoutBtn" class="secondary" type="button">Logout</button>
<h3>નવી યોજના / ભરતી ઉમેરો</h3>

<form id="announcementForm">
<label>પ્રકાર પસંદ કરો</label>
<select id="type" required>
<option value="યોજના">સરકારી યોજના</option>
<option value="ભરતી">સરકારી ભરતી</option>
<option value="અન્ય">અન્ય માહિતી</option>
</select>

<label>શીર્ષક</label>
<input id="title" placeholder="દા.ત. વ્હાલી દીકરી યોજના" required>

<label>વિગતો</label>
<textarea id="description" placeholder="યોજનાની માહિતી, પાત્રતા અને જરૂરી દસ્તાવેજો..." required></textarea>

<label>છેલ્લી તારીખ (વૈકલ્પિક)</label>
<input id="lastDate" type="date">

<label>અરજીની વેબસાઇટ લિંક (વૈકલ્પિક)</label>
<input id="link" type="url" placeholder="https://...">

<div class="checkrow">
<input id="published" type="checkbox">
<label for="published">વેબસાઇટ પર Publish કરો</label>
</div>

<button id="saveBtn" type="submit">માહિતી સેવ કરો</button>
</form>

<p id="status" class="status" role="status"></p>
<hr>
<h3>ઉમેરેલી માહિતી</h3>
<div id="records">માહિતી લોડ થઈ રહી છે...</div>
</section>
</div>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyABMSiPr8QoRaNSMdWDL-Y_cjrrqcfsb_c",
  authDomain: "arvi-online-csc.firebaseapp.com",
  projectId: "arvi-online-csc",
  storageBucket: "arvi-online-csc.firebasestorage.app",
  messagingSenderId: "57206587457",
  appId: "1:57206587457:web:3723726ba2f2ecbd6d86c0",
  measurementId: "G-JJX8CE0TE9"
};

const ADMIN_UID = "nIreaPMvujbR9IrdilWpSyz3o623";

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const statusBox = document.getElementById("status");
const recordsBox = document.getElementById("records");
const form = document.getElementById("announcementForm");

function setStatus(message) {
  statusBox.textContent = message;
}

auth.onAuthStateChanged(user => {
  if (user && user.uid === ADMIN_UID) {
    loginSection.style.display = "none";
    dashboard.style.display = "block";
    loadRecords();
  } else {
    dashboard.style.display = "none";
    loginSection.style.display = "block";
    if (user) {
      auth.signOut();
      setStatus("આ યુઝરને Admin પરવાનગી નથી.");
    }
  }
});

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  setStatus("Login થઈ રહ્યું છે...");
  try {
    const result = await auth.signInWithEmailAndPassword(
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
    if (result.user.uid !== ADMIN_UID) {
      await auth.signOut();
      setStatus("આ યુઝરને Admin પરવાનગી નથી.");
    } else {
      setStatus("Login સફળ થયું.");
    }
  } catch (error) {
    setStatus("Login Error: " + error.message);
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await auth.signOut();
  setStatus("Logout થઈ ગયું.");
});

form.addEventListener("submit", async e => {
  e.preventDefault();

  const user = auth.currentUser;
  if (!user || user.uid !== ADMIN_UID) {
    setStatus("માહિતી ઉમેરવા માટે Admin Login જરૂરી છે.");
    return;
  }

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const link = document.getElementById("link").value.trim();

  if (link && !/^https?:\/\//i.test(link)) {
    setStatus("યોગ્ય https:// અથવા http:// લિંક દાખલ કરો.");
    return;
  }

  const data = {
    type: document.getElementById("type").value,
    title: title,
    description: description,
    lastDate: document.getElementById("lastDate").value,
    link: link,
    published: document.getElementById("published").checked,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "સેવ થઈ રહ્યું છે...";
  setStatus("");

  try {
    await db.collection("announcements").add(data);
    form.reset();
    setStatus("માહિતી સફળતાપૂર્વક સેવ થઈ ગઈ.");
    loadRecords();
  } catch (error) {
    setStatus("સેવ કરવામાં Error: " + error.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "માહિતી સેવ કરો";
  }
});

async function loadRecords() {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) return;

  recordsBox.textContent = "માહિતી લોડ થઈ રહી છે...";

  try {
    const snapshot = await db.collection("announcements")
      .orderBy("createdAt", "desc").get();

    recordsBox.replaceChildren();

    if (snapshot.empty) {
      recordsBox.textContent = "હજી કોઈ માહિતી ઉમેરાઈ નથી.";
      return;
    }

    snapshot.forEach(doc => {
      const d = doc.data();
      const card = document.createElement("div");
      card.className = "item";

      const heading = document.createElement("h3");
      heading.textContent = (d.type || "માહિતી") + ": " + (d.title || "");

      const description = document.createElement("p");
      description.textContent = d.description || "";

      const date = document.createElement("p");
      date.textContent = "છેલ્લી તારીખ: " + (d.lastDate || "નક્કી નથી");

      const publish = document.createElement("p");
      publish.textContent = d.published ? "સ્થિતિ: Published" : "સ્થિતિ: Draft";

      card.append(heading, description, date, publish);

      if (d.link) {
        const link = document.createElement("a");
        link.href = d.link;
        link.textContent = "અરજીની લિંક ખોલો";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        card.appendChild(link);
      }

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.textContent = "આ માહિતી કાઢી નાખો";
      deleteBtn.className = "secondary";
      deleteBtn.addEventListener("click", async () => {
        if (!confirm("શું આ માહિતી કાઢી નાખવી છે?")) return;
        try {
          await db.collection("announcements").doc(doc.id).delete();
          setStatus("માહિતી કાઢી નાખવામાં આવી.");
          loadRecords();
        } catch (error) {
          setStatus("કાઢી નાખવામાં Error: " + error.message);
        }
      });

      card.appendChild(deleteBtn);
      recordsBox.appendChild(card);
    });
  } catch (error) {
    recordsBox.textContent = "માહિતી લોડ કરવામાં Error: " + error.message;
  }
}
</script>
</body>
</html>
